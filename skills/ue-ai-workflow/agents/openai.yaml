interface: # 配置 Skill 的界面名称、简介与启动提示。
  display_name: "UE＋AI 协作工作流" # 保持既有显示名称。
  short_description: "面向 UE 项目的有库无库接入、任务接续、C++ 实现偏好与分层验收" # 简述统一规则下的内部流程分支。
  default_prompt: "使用 $ue-ai-workflow，先读项目规则并确认知识库模式与实现偏好，确认需求后经文档授权创建唯一任务记录或采用无文档保底，再选择执行者、核对一致性并取得本轮实施授权后直接实现，自检及已执行的相应测试通过后交付配置与验收清单，用户明确反馈测试通过后再关闭任务。" # 初始化不等于实施授权，配置交付不等于最终完成。
